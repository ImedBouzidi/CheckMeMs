server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: deep links like /dashboard or /auth/login are served by Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Angular assets never change; cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
