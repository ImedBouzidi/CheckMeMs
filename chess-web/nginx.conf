server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: deep links like /dashboard or /auth/login are served by Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API for the hosted demo: the browser calls /api, nginx forwards
    # to the gateway inside the Compose network. No CORS or hardcoded host needed.
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Browsers send Origin on POST even for same-origin requests, and the
        # gateway's CORS filter only allows the Angular dev server. This proxy
        # is the same-origin boundary, so drop Origin instead of requiring CORS.
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
    }

    # Hashed Angular assets never change; cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
