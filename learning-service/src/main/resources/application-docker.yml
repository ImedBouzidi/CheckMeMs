spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/chess_${APP_NAME:learning-service}
    username: ${DB_USERNAME:chess_user}
    password: ${DB_PASSWORD:chess_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://keycloak:8080/realms/chess-platform}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/chess-platform/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.chessplatform: INFO
