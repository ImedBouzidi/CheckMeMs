spring:
  application:
    name: ${APP_NAME:analysis-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    compatibility-verifier:
      enabled: false
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${APP_NAME:analysis-service}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
