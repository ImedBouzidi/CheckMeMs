spring:
  application:
    name: ${APP_NAME:analysis-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    compatibility-verifier:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8082}
