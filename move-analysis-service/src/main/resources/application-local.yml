spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chess_analysis}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: move-analysis-live
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 600000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/chess-platform}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/chess-platform/protocol/openid-connect/certs}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    imed.moveanalysisservice: DEBUG
    org.springframework.web: INFO

stockfish:
  path: ${STOCKFISH_PATH:stockfish}
  threads: ${STOCKFISH_THREADS:2}
  hash: ${STOCKFISH_HASH:256}
  depth: ${STOCKFISH_DEPTH:18}
  multi-pv: ${STOCKFISH_MULTI_PV:1}
  pool-size: ${STOCKFISH_POOL_SIZE:1}
  borrow-timeout-ms: ${STOCKFISH_BORROW_TIMEOUT_MS:2000}
  search-timeout-ms: ${STOCKFISH_SEARCH_TIMEOUT_MS:15000}
  server-timeout-ms: ${STOCKFISH_SERVER_TIMEOUT_MS:5000}
  restart-backoff-ms: ${STOCKFISH_RESTART_BACKOFF_MS:1000}
  quick:
    depth: ${STOCKFISH_QUICK_DEPTH:12}
    movetime-ms: ${STOCKFISH_QUICK_MOVETIME_MS:150}
  deep:
    depth: ${STOCKFISH_DEEP_DEPTH:18}

analysis:
  live:
    consumer-enabled: true
    finalize-wait-ms: 5000
    finalize-poll-ms: 100
    eval-ttl: 2h
  worker:
    enabled: ${ANALYSIS_WORKER_ENABLED:true}
    concurrency: ${ANALYSIS_WORKER_CONCURRENCY:1}
    poll-interval-ms: ${ANALYSIS_WORKER_POLL_INTERVAL_MS:500}
    lease-seconds: ${ANALYSIS_WORKER_LEASE_SECONDS:300}
    max-attempts: ${ANALYSIS_WORKER_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${ANALYSIS_WORKER_RETRY_BACKOFF_SECONDS:10}
