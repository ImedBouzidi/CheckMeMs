name: chess_mobile
description: "CheckMe — Play, learn and review chess. The mobile companion of the CheckMe platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^18.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  jwt_decoder: ^2.0.1
  chess: ^0.8.1
  stockfish: ^1.8.1
  audioplayers: ^6.8.1
  flutter_svg: ^2.3.2
  intl: ^0.20.3
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/sounds/
    - assets/logo/