spring:
  config:
    activate:
      on-profile: docker
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-profile-auth
          uri: lb://user-profile-service
          predicates:
            - Path=/api/auth/**

        - id: user-profile-service
          uri: lb://user-profile-service
          predicates:
            - Path=/api/users/**

        - id: game-service
          uri: lb://games-service
          predicates:
            - Path=/api/games/**

        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/api/analysis/**

        - id: kafka-service
          uri: lb://kafka-service
          predicates:
            - Path=/api/kafka/**

        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/learning/**

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**

        - id: opening-service
          uri: lb://opening-service
          predicates:
            - Path=/api/openings/**

        - id: puzzle-service
          uri: lb://puzzle-service
          predicates:
            - Path=/api/puzzles/**

        - id: engine-bot-service
          uri: lb://engine-bot-service
          predicates:
            - Path=/api/engine/**

        - id: play-service
          uri: lb://play-service
          predicates:
            - Path=/api/play/**

        - id: matchmaking-service
          uri: lb://matchmaking-service
          predicates:
            - Path=/api/matchmaking/**

        - id: rating-service
          uri: lb://rating-service
          predicates:
            - Path=/api/ratings/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: fairplay-moderation-service
          uri: lb://fairplay-moderation-service
          predicates:
            - Path=/api/fairplay/**

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
