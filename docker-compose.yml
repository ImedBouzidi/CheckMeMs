# CheckMeMS — full stack in Docker
#
#   docker compose up -d --build
#
# Browser endpoints stay on the same ports as the local dev stack:
#   http://localhost:4200  web (nginx)
#   http://localhost:8081  gateway
#   http://localhost:8085  Keycloak (host 8080 is taken by local Jenkins; the
#                          container still listens on 8080 internally)
#   http://localhost:8761  Eureka console
#   :8082 analysis :8083 games :8084 profiles :8088 events :8091 learning (direct)
#
# Images are tagged with the Docker Hub namespace directly, so pushing everything
# after a build is one command:
#   docker compose build --pull
#   docker compose push
#
# Two supporting images are built from repo-root contexts:
#   - keycloak  (docker/keycloak/Dockerfile): quay.io/keycloak + baked-in realm export,
#     so ./keycloak-21.1.1 does not need to be mounted on the host anymore.
#
# Internal-only (no host port): postgres 5432, kafka 29092(+29093).
# They never collide with the local dev instances that share the same defaults.
#
# Token validation quirk (see below *keycloak-env): Keycloak advertises iss=http://localhost:8080
# to the browser; services validate the iss claim against that URL and fetch JWKS from inside
# the compose network, so both stay correct at once.
name: checkmems

networks:
  chess-net:

volumes:
  pgdata:

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: chess_user
  DB_PASSWORD: ${POSTGRES_PASSWORD:-chess_pass}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/

x-keycloak-env: &keycloak-env
  # The realm is imported from keycloak-21.1.1/data/import/realm-export.json. The
  # compose Keycloak runs on host port KEYCLOAK_HOST_PORT (default 8085) and
  # KC_HOSTNAME advertises that, so JWTs the browser mints carry
  # iss=http://localhost:8085/...; resource servers must compare against that
  # exact URL.
  OAUTH2_ISSUER_URI: http://localhost:8085/realms/chess-platform
  # JWKS fetch service-to-service, inside the compose network (container port).
  OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/chess-platform/protocol/openid-connect/certs

x-java-opts: &java-opts
  SPRING_PROFILES_ACTIVE: docker
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Duser.timezone=UTC

services:

  ## ---------- infrastructure ----------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_pass}
      # First database is created by the image itself; the rest via the init script.
      POSTGRES_DB: chess_user_profile
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init-multiple-dbs.sql:/docker-entrypoint-initdb.d/10-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_user_profile"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [chess-net]

  kafka:
    # Apache Kafka 4.4.0, KRaft combined mode (broker + controller in one node).
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [chess-net]

  keycloak:
    image: imedbennington/keycloak:latest
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: chess_user
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-chess_pass}
      # Frontend URL (auth redirects, iss claim) tracks the published host port.
      # Keycloak 21 does not parse a full URL in KC_HOSTNAME - use the
      # host/port pair instead.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOST_PORT:-8085}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8085}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [chess-net]

  ## ---------- platform ----------

  eureka:
    build: ./eureka-server
    image: imedbennington/eureka:latest
    environment: { <<: *java-opts }
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [chess-net]

  gateway:
    build: ./api-gateway
    image: imedbennington/gateway:latest
    environment: { <<: *java-opts }
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      eureka: { condition: service_healthy }
    networks: [chess-net]

  ## ---------- business services ----------
  # Ports match application-docker.yml. SERVER_PORT is required where the
  # yml leaves it without a default (user-profile-service).

  games:
    build: ./games-service
    image: imedbennington/games:latest
    environment:
      <<: [*java-opts, *db-env, *keycloak-env]
      SERVER_PORT: 8083
      DB_NAME: chess_game
      # talks to move-analysis via lb://analysis-service
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [chess-net]

  profiles:
    build:
      context: .
      dockerfile: user-profile-service/Dockerfile
    image: imedbennington/profiles:latest
    environment:
      <<: [*java-opts, *db-env, *keycloak-env]
      SERVER_PORT: 8084
      DB_NAME: chess_user_profile
      APP_NAME: user-profile-service
      KEYCLOAK_AUTH_SERVER_URL: http://host.docker.internal:8085
      KEYCLOAK_REALM: chess-platform
      KEYCLOAK_RESOURCE: user-profile-service
      KEYCLOAK_LOGIN_CLIENT_ID: chess-web
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_USER_PROFILE_CLIENT_SECRET: ${KEYCLOAK_USER_PROFILE_CLIENT_SECRET:-WYs5nX2LrnlaQPkH4Hmy4LWqNCYVaIWP}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8084"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [chess-net]

  learning:
    build:
      context: .
      dockerfile: learning-service/Dockerfile
    image: imedbennington/learning:latest
    environment:
      <<: [*java-opts, *db-env, *keycloak-env]
      SERVER_PORT: 8091
      # application-docker.yml derives the DB name: chess_${APP_NAME} -> chess_learning-service
      APP_NAME: learning-service
    ports:
      - "8091:8091"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [chess-net]

  analysis:
    # Builds Stockfish from ../stockfish in an extra context (see Dockerfile header).
    build:
      context: ./move-analysis-service
      dockerfile: Dockerfile
      additional_contexts:
        - "stockfish=./stockfish"
    image: imedbennington/analysis:latest
    environment:
      <<: [*java-opts, *db-env, *keycloak-env]
      SERVER_PORT: 8082
      # application-docker.yml derives the DB name: chess_${APP_NAME} -> chess_analysis-service
      APP_NAME: analysis-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STOCKFISH_PATH: /usr/bin/stockfish
      STOCKFISH_POOL_SIZE: ${STOCKFISH_POOL_SIZE:-1}
      STOCKFISH_THREADS: ${STOCKFISH_THREADS:-2}
      STOCKFISH_HASH: ${STOCKFISH_HASH:-256}
      STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-18}
      ANALYSIS_WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY:-1}
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [chess-net]

  events:
    build: ./kafka-service
    image: imedbennington/events:latest
    environment:
      <<: *java-opts
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8088:8088"
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      eureka: { condition: service_healthy }
    networks: [chess-net]

  web:
    build: ./chess-web
    image: imedbennington/web:latest
    ports:
      - "4200:80"
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_started }
    networks: [chess-net]
