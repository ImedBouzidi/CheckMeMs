spring:
  config:
    activate:
      on-profile: docker
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}

server:
  port: ${SERVER_PORT}

logging:
  level:
    com.chessplatform: INFO

keycloak:
  server-url: ${KEYCLOAK_AUTH_SERVER_URL}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_RESOURCE}
  resource: ${KEYCLOAK_RESOURCE}
  client-secret: ${KEYCLOAK_USER_PROFILE_CLIENT_SECRET}
  login-client-id: ${KEYCLOAK_LOGIN_CLIENT_ID:chess-web}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
  client:
    secret: ${KEYCLOAK_USER_PROFILE_CLIENT_SECRET}
